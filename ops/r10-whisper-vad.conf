# Whisper STT — Voice Activity Detection (VAD) Configuration
# Tuned for: home office, single speaker, Audient Evo 4 input
#
# These parameters control when whisper.cpp starts and stops transcribing.
# The goal: transcribe speech, ignore everything else (HVAC, keyboard, traffic).

[vad]
# Energy threshold in dBFS. Audio below this is silence.
# -40 dBFS is conservative — catches soft speech but ignores most ambient noise.
# If false triggers occur (HVAC, fan noise), raise to -35 dBFS.
# If soft speech is missed, lower to -45 dBFS.
energy_threshold_dbfs = -40

# Speech onset: milliseconds of energy above threshold before recording starts.
# 300ms prevents single clicks/coughs from triggering.
# Lower (150ms) for faster response, higher (500ms) to filter more noise.
speech_onset_ms = 300

# Speech offset: milliseconds of silence after speech before segment ends.
# 1500ms (1.5s) allows natural pauses between sentences without splitting.
# Lower (800ms) for faster turnaround, higher (2000ms) for monologue-style speech.
speech_offset_ms = 1500

# Maximum segment duration in seconds.
# Force-submits to whisper if someone talks continuously.
# 30s balances context (longer = better accuracy) vs latency (shorter = faster response).
max_segment_s = 30

# Minimum segment duration in seconds.
# Discard segments shorter than this — they're clicks, coughs, brief noise.
min_segment_s = 1.0

# Pre-roll: seconds of audio to keep before speech onset is detected.
# Captures the beginning of words that triggered the onset.
# 0.5s means we buffer half a second before the threshold was crossed.
pre_roll_s = 0.5

[audio]
# Sample rate — whisper's native rate. No resampling needed.
sample_rate = 16000

# Channels — mono. Speech input, stereo adds nothing.
channels = 1

# Bit depth — whisper.cpp expects signed 16-bit little-endian PCM.
format = s16le

# ALSA device — matches the asound.conf capture device.
device = evo4

# Buffer size for ALSA capture in frames.
# At 16kHz, 1024 frames = 64ms latency. Low enough for real-time.
buffer_frames = 1024

[output]
# Where transcripts go after whisper processes them.
# relay: POST to relay's internal API for intelligent routing
# webhook: POST to a Discord webhook URL (simpler, less intelligent)
# both: send to relay AND log to file
mode = relay

# Relay endpoint for transcript delivery.
# Relay parses intent and routes to the right Discord channel.
relay_endpoint = http://localhost:3847/api/whisper-transcript

# Log transcripts to file (for debugging, disable in production if privacy concern).
log_file = /var/log/nwl/whisper-transcripts.log

# Include confidence score in output.
include_confidence = true

# Include detected language in output.
include_language = true

[model]
# Whisper model size. medium is the sweet spot for R10's Ryzen 7 5800X.
# Benchmarks: ~2-3x realtime (10s speech = 4s processing).
size = medium

# Model file path on R10.
path = /opt/nwl/whisper/models/ggml-medium.bin

# Language hint — improves accuracy when language is known.
language = en

# Translate to English (if input is non-English). false = transcribe as-is.
translate = false
