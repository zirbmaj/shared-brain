# NWL dependency chain override for ollama.service
# Starts after Tailscale so mesh clients can reach it.
# Also sets OLLAMA_HOST to listen on all interfaces.
[Unit]
After=tailscaled.service
Wants=tailscaled.service
StartLimitBurst=3
StartLimitIntervalSec=600

[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
Restart=on-failure
RestartSec=15
