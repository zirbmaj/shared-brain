# NWL dependency chain override for postgresql.service
# Ensures postgres starts after Tailscale mesh is up
# so it can listen on the mesh interface (nwl-r10)
# Note: postgresql.service is Type=oneshot — cannot set Restart= here.
# The actual postgres process is managed by postgresql@16-main.service.
[Unit]
After=tailscaled.service
Wants=tailscaled.service
