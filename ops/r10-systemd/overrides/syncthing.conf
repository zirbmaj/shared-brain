# NWL dependency chain override for syncthing@.service
# Ensures syncthing starts after Tailscale mesh so it can
# discover and connect to nwl-mini over the overlay network.
[Unit]
After=tailscaled.service
Wants=tailscaled.service
StartLimitBurst=3
StartLimitIntervalSec=600

[Service]
Restart=on-failure
RestartSec=10
