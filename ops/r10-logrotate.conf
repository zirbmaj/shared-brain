# =============================================================================
# NWL-R10 Logrotate Configuration
# Install: sudo cp r10-logrotate.conf /etc/logrotate.d/nwl
# Test:    sudo logrotate -d /etc/logrotate.d/nwl
# =============================================================================

# --- First boot log ---
# Written by r10-first-boot.sh. One-time, but can grow if re-run.
/var/log/nwl-first-boot.log {
    monthly
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
}

# --- NUT/UPS logs ---
# Written by ups-notify.sh and cluster-shutdown.sh
/var/log/nwl-ups-notify.log
/var/log/nwl-cluster-shutdown.log {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
}

# --- Agent shutdown log ---
# Written by agent-shutdown-all.sh during graceful shutdown
/var/log/agent-shutdown.log {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
}

# --- Restore test log ---
# Written by r10-backup-restore-test.sh
/var/log/nwl-restore-test.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
}

# --- RAG indexer log ---
# Written by the RAG indexer daemon (inotify watcher + embedding pipeline)
/var/log/nwl-rag-indexer.log {
    su nwl-svc nwl-svc
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 nwl-svc nwl-svc
    size 50M
}

# --- Node health API log ---
# Written by node-health-server.sh
/var/log/nwl-health-api.log {
    su nwl-svc nwl-svc
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 nwl-svc nwl-svc
}

# --- Per-tenant application logs ---
/var/log/nwl/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 nwl-svc nwl-svc
    sharedscripts
}

/var/log/meridian/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 meridian-svc meridian-svc
    sharedscripts
}

/var/log/chowder/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 chowder-svc chowder-svc
    sharedscripts
}

# =============================================================================
# Retention limits for large data directories
# These are not logrotate targets — they're cleaned by the cron job below.
# Install the companion cron: sudo cp r10-retention-cron /etc/cron.daily/nwl-retention
# =============================================================================
