# Audient Evo 4 — ALSA capture configuration for R10
# Install: sudo cp r10-evo4-alsa.conf /etc/asound.conf
#
# The Evo 4 is a USB Audio Class 2.0 device — no drivers needed on Linux.
# ALSA sees it as a standard USB audio interface.
#
# To find the card name after plugging in:
#   arecord -l | grep -i evo
#   cat /proc/asound/cards
#
# The card name may vary (Evo4, EVO4, Audient). Update pcm.evo4_raw
# if needed to match `arecord -l` output.

# --- Raw hardware capture device ---
pcm.evo4_raw {
    type hw
    card EVO4
    device 0
    format S16_LE
    rate 16000
    channels 1
}

# --- Rate-converted capture (fallback if hardware doesn't support 16kHz directly) ---
pcm.evo4 {
    type plug
    slave {
        pcm "evo4_raw"
        rate 16000
        channels 1
        format S16_LE
    }
}

# --- Loopback for monitoring (optional, allows listening to what whisper hears) ---
pcm.evo4_monitor {
    type plug
    slave {
        pcm "evo4_raw"
    }
}

# --- Default capture route (whisper uses this) ---
pcm.!default {
    type asym
    playback.pcm "default"
    capture.pcm "evo4"
}

# --- CTL for mixer access ---
ctl.evo4 {
    type hw
    card EVO4
}
